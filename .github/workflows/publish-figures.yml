name: Publish Matplotlib report figures

on:
  push:
    branches: [main]
    paths:
      - scripts/plot_report_figures.py
      - .github/workflows/publish-figures.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Korean font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          fc-cache -f
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate original-data Matplotlib charts
        run: python -m scripts.plot_report_figures
      - name: Check figures and stored metrics
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          p=Path("results/figures")
          for n in ("report_hourly_mean", "report_test_profile",
                    "report_model_errors", "report_season_bias"):
              for ext in (".svg", ".png", ".pdf"):
                  f=p/(n+ext)
                  assert f.exists() and f.stat().st_size>2000, f
          m=pd.read_csv(p/"report_model_scores.csv")
          assert len(m)==5
          assert abs(m.iloc[-1].test_mae-280.575010)<0.005
          print("All figures and observed-data metrics verified")
          PY
      - name: Commit figures (without editing submission documents)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/figures/report_*.pdf results/figures/report_*.svg results/figures/report_*.png results/figures/report_model_scores.csv
          if ! git diff --cached --quiet; then
            git commit -m "figures: publish Matplotlib plots based on original CSV"
            git push origin HEAD:main
          else
            echo "Charts already up to date"
          fi
