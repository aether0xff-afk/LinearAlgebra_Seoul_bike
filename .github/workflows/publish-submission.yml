name: Legacy submission builder (manual only)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Korean fonts, document converter and PDF inspector
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum fonts-nanum-extra libreoffice-writer poppler-utils
          fc-cache -f
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt 'python-docx>=1.1,<2'
      - name: Generate editable DOCX from recorded data
        run: python scripts/build_submission.py
      - name: Apply classroom assessment form
        run: python scripts/reformat_form.py
      - name: Export PDF
        run: |
          libreoffice -env:UserInstallation=file:///tmp/lo_seoul_bike_submission --headless --convert-to pdf --outdir submission submission/*.docx
      - name: Validate both files and report content
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import subprocess
          base="서울_공공자전거_수학적모델링_탐구보고서"
          docx=Path("submission")/(base+".docx")
          pdf=Path("submission")/(base+".pdf")
          assert docx.is_file() and docx.stat().st_size>30000, docx
          assert pdf.is_file() and pdf.stat().st_size>30000, pdf
          with ZipFile(docx) as z:
              assert "word/document.xml" in z.namelist()
              text=z.read("word/document.xml").decode("utf-8")
              assert "8,465" in text
          count=subprocess.check_output(["pdfinfo",str(pdf)],text=True)
          print(next(line for line in count.splitlines() if line.startswith("Pages:")))
          extracted=subprocess.check_output(["pdftotext",str(pdf),"-"],text=True)
          assert "405.584" in extracted
          assert "이은세" in extracted
          assert len(extracted)>1000
          print("DOCX and PDF validated", docx.stat().st_size, pdf.stat().st_size)
          PY
      - name: Commit both submission files to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add submission/*.docx submission/*.pdf
          if git diff --cached --quiet; then
            echo 'No new submission changes'
          else
            git commit -m 'docs: publish completed Seoul bike report in DOCX and PDF'
            git push origin HEAD:main
          fi
